sonar.projectKey=vicecity-app
sonar.projectName=ViceCity Fan Site
sonar.sources=src/main
sonar.tests=src/test
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
# main() only bootstraps Spring; it is exercised by the context smoke test, not line coverage
sonar.coverage.exclusions=**/ViceCityApplication.java,**/static/**
